name: Deploy to Google Cloud Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'

  test-backend:
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: twogether_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Restore SQLx metadata cache
        uses: actions/cache@v4
        with:
          path: backend/.sqlx
          key: sqlx-${{ hashFiles('backend/migrations/**/*.sql', 'backend/Cargo.lock') }}
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Setup test database
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twogether_test
        run: |
          sqlx database create
          sqlx migrate run
      - name: Generate SQLx metadata (only if cache miss)
        if: ${{ hashFiles('backend/.sqlx/**') == '' }}
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twogether_test
        run: cargo sqlx prepare
      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twogether_test
          JWT_SECRET: test-secret-key
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
        run: cargo test

  test-frontend:
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Use Node from container
        run: node -v && npm -v
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run Playwright tests
        working-directory: ./frontend
        env:
          CI: true
        run: npm run test:e2e
      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  build-and-deploy:
    needs: [changes, test-backend, test-frontend]
    if: always() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps and build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}


      - name: Deploy to App Engine (backend, frontend, dispatch)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
        run: |
          echo "🚀 Deploying to App Engine..."

          # Update backend app.yaml with secrets
          python3 << EOF
          import os

          # Read the current app.yaml
          with open('backend/app.yaml', 'r') as f:
              content = f.read()

          # Replace env_variables section
          lines = content.split('\n')
          new_lines = []
          skip_env_vars = False

          for line in lines:
              if line.strip().startswith('env_variables:'):
                  # Add our env_variables section
                  new_lines.append('env_variables:')
                  new_lines.append('  RUST_LOG: info')
                  new_lines.append('  ENVIRONMENT: production')
                  new_lines.append(f'  DATABASE_URL: "{os.environ["DATABASE_URL"]}"')
                  new_lines.append(f'  JWT_SECRET: "{os.environ["JWT_SECRET"]}"')
                  new_lines.append(f'  SUPABASE_URL: "{os.environ["SUPABASE_URL"]}"')
                  new_lines.append(f'  SUPABASE_ANON_KEY: "{os.environ["SUPABASE_ANON_KEY"]}"')
                  new_lines.append(f'  SUPABASE_SERVICE_ROLE_KEY: "{os.environ["SUPABASE_SERVICE_ROLE_KEY"]}"')
                  new_lines.append(f'  EMAIL_FROM: "{os.environ["EMAIL_FROM"]}"')
                  new_lines.append(f'  EMAIL_PASS: "{os.environ["EMAIL_PASS"]}"')
                  new_lines.append(f'  RESEND_API_KEY: "{os.environ["RESEND_API_KEY"]}"')
                  new_lines.append(f'  CORS_ORIGIN: "{os.environ["CORS_ORIGIN"]}"')
                  skip_env_vars = True
              elif skip_env_vars and line.strip() and not line.startswith('  '):
                  # End of env_variables section
                  skip_env_vars = False
                  new_lines.append(line)
              elif not skip_env_vars:
                  new_lines.append(line)

          # Write back to file
          with open('backend/app.yaml', 'w') as f:
              f.write('\n'.join(new_lines))
          EOF

          gcloud app deploy backend/app.yaml frontend/app.yaml dispatch.yaml --quiet --project=${{ env.PROJECT_ID }}

      - name: Post-deploy info
        run: gcloud app services list --project=${{ env.PROJECT_ID }}