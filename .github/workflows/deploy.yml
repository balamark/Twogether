name: Deploy to Google Cloud Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps and build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to App Engine (backend, frontend, dispatch)
        run: |
          echo "🚀 Deploying to App Engine..."
          gcloud app deploy backend/app.yaml frontend/app.yaml dispatch.yaml --quiet --project=${{ env.PROJECT_ID }}

      - name: Post-deploy info
        run: |
          gcloud app services list --project=${{ env.PROJECT_ID }} 