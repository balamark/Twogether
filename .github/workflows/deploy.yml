name: Deploy to Google Cloud Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'routes/**'
              - 'database/**'
              - 'middleware/**'
              - 'server.js'
              - 'package.json'
              - 'app.yaml'
              - '.github/workflows/deploy.yml'

  test-and-deploy:
    needs: [changes]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: twogether_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build
      
      - name: Set up test database and run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twogether_test
          JWT_SECRET: test-secret-key-for-ci
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
          PORT: 8080
          NODE_ENV: test
        run: |
          echo "�️ Setting up test database..."
          # Wait for PostgreSQL to be ready
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          
          # Run database migrations
          npm run migrate
          
          echo "🧪 Running integration tests with server..."
          npm run test:ci

      - name: Google Auth
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to App Engine
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 15
        env:
          _DATABASE_URL: ${{ secrets.DATABASE_URL }}
          _JWT_SECRET: ${{ secrets.JWT_SECRET }}
          _SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          _SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          _SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          _EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          _EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          _RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          _CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
        run: |
          echo "🚀 Deploying Twogether app directly to App Engine..."
          # Create app.yaml with actual environment variables
          envsubst < app.yaml > app.yaml.tmp && mv app.yaml.tmp app.yaml
          gcloud app deploy --quiet --project=${{ env.PROJECT_ID }}

      - name: Deployment Summary
        if: always() && github.ref == 'refs/heads/main'
        run: |
          echo "📊 Deployment completed!"
          if [ ${{ job.status }} == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed"
          fi