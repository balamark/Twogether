name: Deploy to Google Cloud Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'frontend/**'
              - 'routes/**'
              - 'database/**'
              - 'middleware/**'
              - 'server.js'
              - 'package.json'
              - 'app.yaml'
              - '.github/workflows/deploy.yml'
              - 'cloudbuild.yaml'

  test-app:
    needs: [changes]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: twogether_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install backend dependencies
        run: npm ci
      - name: Test backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twogether_test
          JWT_SECRET: test-secret-key
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
        run: npm run test:backend

      - name: Install frontend dependencies and test
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
      - name: Run frontend E2E tests
        working-directory: ./frontend
        env:
          CI: true
        run: |
          # Skip E2E tests in CI for now (can be added later)
          echo "Frontend build successful"

  deploy:
    needs: [changes, test-app]
    if: always() && needs.changes.outputs.app == 'true' && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy combined app with Cloud Build
        timeout-minutes: 15
        run: |
          echo "🚀 Deploying combined Twogether app to App Engine Standard..."
          gcloud builds submit --config=cloudbuild.yaml --project=${{ env.PROJECT_ID }} \
            --substitutions=_DATABASE_URL="${{ secrets.DATABASE_URL }}",_JWT_SECRET="${{ secrets.JWT_SECRET }}",_SUPABASE_URL="${{ secrets.SUPABASE_URL }}",_SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}",_SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}",_EMAIL_FROM="${{ secrets.EMAIL_FROM }}",_EMAIL_PASS="${{ secrets.EMAIL_PASS }}",_RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}",_CORS_ORIGIN="${{ secrets.CORS_ORIGIN }}"

      - name: Check deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📊 Deployment Status Check"

          # Check GitHub Actions run status
          gh run list --limit 1 --json status,conclusion,headSha,workflowName

          # Check App Engine services
          echo "🚀 App Engine Services:"
          gcloud app services list --project=${{ env.PROJECT_ID }}

          # Check if deployment was successful
          if [ ${{ job.status }} == "success" ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "❌ Deployment failed or had issues"
          fi