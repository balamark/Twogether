name: Deploy to Google Cloud Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  FRONTEND_BUCKET: ${{ secrets.GCP_FRONTEND_BUCKET }}
  BACKEND_SERVICE: twogether-backend

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'

  test-backend:
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: twogether_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Restore SQLx metadata cache
        uses: actions/cache@v4
        with:
          path: backend/.sqlx
          key: sqlx-${{ hashFiles('backend/migrations/**/*.sql', 'backend/Cargo.lock') }}
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Setup test database
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twogether_test
        run: |
          sqlx database create
          sqlx migrate run
      - name: Generate SQLx metadata (only if cache miss)
        if: ${{ hashFiles('backend/.sqlx/**') == '' }}
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twogether_test
        run: |
          cargo sqlx prepare
      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twogether_test
          JWT_SECRET: test-secret-key
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
        run: cargo test

  test-frontend:
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Use Node from container
        run: node -v && npm -v
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run Playwright tests
        working-directory: ./frontend
        env:
          CI: true
        run: npm run test:e2e
      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  # Backend Preparation
  prepare-backend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Restore SQLx metadata cache
        uses: actions/cache@v4
        with:
          path: backend/.sqlx
          key: sqlx-${{ hashFiles('backend/migrations/**/*.sql', 'backend/Cargo.lock') }}
      - name: Generate SQLx metadata (only if cache miss)
        if: ${{ hashFiles('backend/.sqlx/**') == '' }}
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p .sqlx
          cargo install sqlx-cli --no-default-features --features postgres
          cargo sqlx prepare
      - uses: docker/setup-buildx-action@v3
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Configure Docker auth for GCR
        run: gcloud auth configure-docker gcr.io --quiet
      - name: Build and push Docker image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          build-args: |
            SQLX_OFFLINE=true
          push: true
          tags: gcr.io/${{ env.PROJECT_ID }}/twogether-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Backend Deploy
  deploy-backend:
    needs: [prepare-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image gcr.io/${{ env.PROJECT_ID }}/twogether-backend:${{ needs.prepare-backend.outputs.image_tag }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 5 \
            --timeout 300 \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --set-env-vars "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            --set-env-vars "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --set-env-vars "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars "MAX_FILE_SIZE=10485760" \
            --set-env-vars "CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}" \
            --set-env-vars "HOST=0.0.0.0" \
            --set-env-vars "ENVIRONMENT=production" \
            --set-env-vars "SMTP_HOST=${{ secrets.SMTP_HOST }}" \
            --set-env-vars "SMTP_PORT=${{ secrets.SMTP_PORT }}" \
            --set-env-vars "SMTP_USER=${{ secrets.SMTP_USER }}" \
            --set-env-vars "SMTP_PASS=${{ secrets.SMTP_PASS }}" \
            --set-env-vars "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" \
            --set-env-vars "SMTP_SECURE=starttls|tls|none"

      - name: Apply startup CPU boost annotation
        run: |
          gcloud run services update ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --update-annotations run.googleapis.com/startup-cpu-boost=true

  # Frontend Build and Deploy
  build-frontend:
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Get Backend Service URL
        id: get_service_url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} --region=${{ env.REGION }} --format="value(status.url)")
          echo "backend_url=$SERVICE_URL" >> $GITHUB_OUTPUT
      - name: Build frontend with API URL
        working-directory: ./frontend
        run: |
          FULL_API_BASE_URL="${{ steps.get_service_url.outputs.backend_url }}/api"
          VITE_API_BASE_URL="$FULL_API_BASE_URL" npm run build
      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy-frontend:
    needs: [deploy-backend, build-frontend]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Deploy frontend to Cloud Storage
        run: |
          gsutil -m rsync -d -r frontend/dist gs://${{ env.FRONTEND_BUCKET }}
          gsutil iam ch allUsers:objectViewer gs://${{ env.FRONTEND_BUCKET }}
          gsutil web set -m index.html -e 404.html gs://${{ env.FRONTEND_BUCKET }}

  # Health check
  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Health check backend
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} --region=${{ env.REGION }} --format="value(status.url)")
          curl -f "$SERVICE_URL/health" || exit 1

      - name: Health check frontend
        run: |
          FRONTEND_URL="https://storage.googleapis.com/${{ env.FRONTEND_BUCKET }}/index.html"
          curl -f "$FRONTEND_URL" || exit 1 