name: Deploy to Google Cloud Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'routes/**'
              - 'database/**'
              - 'middleware/**'
              - 'lib/**'
              - 'scripts/**'
              - 'test*.js'
              - 'test*.sh'
              - '**/*test*.js'
              - '**/*test*.ts'
              - 'tests/**'
              - 'server.js'
              - 'package.json'
              - 'package-lock.json'
              - 'app.yaml'
              - 'app.staging.yaml'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'playwright.config.ts'
              - 'eslint.config.js'
              - '.github/workflows/deploy.yml'

  test-and-deploy:
    needs: [changes]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: twogether_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build

      - name: Validate admin dashboard inline script
        run: npm run check:admin

      - name: Set up test database and run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twogether_test
          JWT_SECRET: test-secret-key-for-ci
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
          PORT: 8080
          NODE_ENV: test
        run: |
          echo "�️ Setting up test database..."
          # Wait for PostgreSQL to be ready
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          
          # Run database migrations
          npm run migrate
          
          echo "🧪 Running integration tests with server..."
          npm run test:ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twogether_test
          JWT_SECRET: test-secret-key-for-ci
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
          PORT: 8080
          NODE_ENV: test
        run: |
          echo "🎭 Running Playwright E2E tests..."
          npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Google Auth
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Run Production Database Migrations
        if: github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          echo "🗄️ Running production database migrations..."
          npm run migrate

      # App Engine caps an app at 210 versions and a new deploy fails once the
      # cap is hit. We never pruned versions before (only container images), so
      # they accumulated. Prune BEFORE deploying so there's always room: keep
      # the 3 newest versions of the 'default' service and delete the rest —
      # but never the version currently serving traffic.
      - name: Clean up old App Engine versions (keep 3 newest)
        if: github.ref == 'refs/heads/main'
        run: |
          set +e
          SERVICE=default
          KEEP=3
          echo "🧹 Pruning old '$SERVICE' versions (keeping the $KEEP newest, never the one serving traffic)..."
          # Versions receiving traffic must never be deleted.
          SERVING=$(gcloud app versions list --service="$SERVICE" \
            --filter="traffic_split>0" --format="value(id)" \
            --project=${{ env.PROJECT_ID }})
          # All versions, newest first; skip the newest $KEEP — the rest are prune candidates.
          CANDIDATES=$(gcloud app versions list --service="$SERVICE" \
            --sort-by="~version.createTime" --format="value(id)" \
            --project=${{ env.PROJECT_ID }} | tail -n +$((KEEP + 1)))
          TO_DELETE=""
          for v in $CANDIDATES; do
            if echo "$SERVING" | grep -qx "$v"; then
              echo "Skipping serving version: $v"
              continue
            fi
            TO_DELETE="$TO_DELETE $v"
          done
          if [ -n "$TO_DELETE" ]; then
            echo "Deleting old versions:$TO_DELETE"
            gcloud app versions delete $TO_DELETE --service="$SERVICE" --quiet \
              --project=${{ env.PROJECT_ID }} || echo "⚠️ Some versions could not be deleted (continuing)"
            echo "✅ Version cleanup completed"
          else
            echo "ℹ️ No old versions to prune (3 or fewer exist)"
          fi

      - name: Deploy to App Engine
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 15
        env:
          _DATABASE_URL: ${{ secrets.DATABASE_URL }}
          _JWT_SECRET: ${{ secrets.JWT_SECRET }}
          _SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          _SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          _SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          _EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          _EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          _RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          _SMTP_HOST: ${{ secrets.SMTP_HOST }}
          _SMTP_PORT: ${{ secrets.SMTP_PORT }}
          _SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          _SMTP_USER: ${{ secrets.SMTP_USER }}
          _SMTP_PASS: ${{ secrets.SMTP_PASS }}
          _CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          _LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'claude' }}
          _ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          _ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          _LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          _LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          _LINE_OA_ADD_URL: ${{ vars.LINE_OA_ADD_URL }}
        run: |
          echo "🚀 Deploying Twogether app directly to App Engine..."
          # Create app.yaml with actual environment variables
          envsubst < app.yaml > app.yaml.tmp && mv app.yaml.tmp app.yaml
          gcloud app deploy --quiet --project=${{ env.PROJECT_ID }}

      # Regression guard for the blank-page outage (2026-07-04): the served
      # index.html must be able to load every asset it references. Catches any
      # index.html ↔ static-files drift (e.g. GAE rebuilding the frontend with
      # a different bundle hash) before users see a white screen.
      - name: Post-deploy smoke check — page assets must load
        if: github.ref == 'refs/heads/main'
        run: |
          sleep 20
          HTML=$(curl -fsS https://twogether.fun/)
          ASSETS=$(echo "$HTML" | grep -oE 'assets/[A-Za-z0-9_.-]+\.(js|css)' | sort -u)
          if [ -z "$ASSETS" ]; then
            echo "❌ No asset references found in served index.html"; exit 1
          fi
          FAIL=0
          for asset in $ASSETS; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://twogether.fun/$asset")
            echo "$asset -> $code"
            [ "$code" = "200" ] || FAIL=1
          done
          if [ "$FAIL" = "1" ]; then
            echo "❌ Served index.html references assets that 404 — page is blank for users"
            exit 1
          fi
          echo "✅ All referenced assets load"

      - name: Clean up old container images
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🧹 Cleaning up old container images..."
          # Keep only the last 5 images from gae-standard repository
          echo "Cleaning repository: gae-standard"
          IMAGES_TO_DELETE=$(gcloud artifacts docker images list \
            asia-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/gae-standard \
            --format="value(IMAGE)" \
            --sort-by=~createTime 2>/dev/null | tail -n +6 || echo "")

          if [ ! -z "$IMAGES_TO_DELETE" ]; then
            echo "$IMAGES_TO_DELETE" | while read -r image; do
              echo "Deleting old image: $image"
              gcloud artifacts docker images delete "$image" --quiet --project=${{ env.PROJECT_ID }} || echo "Failed to delete $image"
            done
            echo "✅ Cleanup completed"
          else
            echo "ℹ️ No old images to delete (less than 6 images found)"
          fi

      - name: Deployment Summary
        if: always() && github.ref == 'refs/heads/main'
        run: |
          echo "📊 Deployment completed!"
          if [ ${{ job.status }} == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed"
          fi

  deploy-staging:
    needs: test-and-deploy
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Reconcile Staging Migration Ledger
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_ENV: production
        run: |
          echo "🔧 Reconciling staging migration ledger (guarded, idempotent)..."
          node scripts/repair-migration-ledger.js

      - name: Run Staging Database Migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_ENV: production
        run: |
          echo "🗄️ Running staging database migrations..."
          npm run migrate

      # Same version-cap guard as prod, scoped to the 'staging' service so PR
      # staging deploys don't pile up toward the app's 210-version limit.
      - name: Clean up old App Engine versions (staging, keep 3 newest)
        run: |
          set +e
          SERVICE=staging
          KEEP=3
          echo "🧹 Pruning old '$SERVICE' versions (keeping the $KEEP newest, never the one serving traffic)..."
          SERVING=$(gcloud app versions list --service="$SERVICE" \
            --filter="traffic_split>0" --format="value(id)" \
            --project=${{ env.PROJECT_ID }})
          CANDIDATES=$(gcloud app versions list --service="$SERVICE" \
            --sort-by="~version.createTime" --format="value(id)" \
            --project=${{ env.PROJECT_ID }} | tail -n +$((KEEP + 1)))
          TO_DELETE=""
          for v in $CANDIDATES; do
            if echo "$SERVING" | grep -qx "$v"; then
              echo "Skipping serving version: $v"
              continue
            fi
            TO_DELETE="$TO_DELETE $v"
          done
          if [ -n "$TO_DELETE" ]; then
            echo "Deleting old versions:$TO_DELETE"
            gcloud app versions delete $TO_DELETE --service="$SERVICE" --quiet \
              --project=${{ env.PROJECT_ID }} || echo "⚠️ Some versions could not be deleted (continuing)"
            echo "✅ Version cleanup completed"
          else
            echo "ℹ️ No old versions to prune (3 or fewer exist)"
          fi

      - name: Deploy to App Engine (staging)
        timeout-minutes: 15
        env:
          _STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          _STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          _STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          _JWT_SECRET: ${{ secrets.JWT_SECRET }}
          _EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          _EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          _RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          _SMTP_HOST: ${{ secrets.SMTP_HOST }}
          _SMTP_PORT: ${{ secrets.SMTP_PORT }}
          _SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          _SMTP_USER: ${{ secrets.SMTP_USER }}
          _SMTP_PASS: ${{ secrets.SMTP_PASS }}
          _CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          _LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'claude' }}
          _ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          _ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          _LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          _LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          _LINE_OA_ADD_URL: ${{ vars.LINE_OA_ADD_URL }}
        run: |
          echo "🚀 Deploying PR #${{ github.event.pull_request.number }} to staging..."
          envsubst < app.staging.yaml > app.staging.yaml.tmp && mv app.staging.yaml.tmp app.staging.yaml
          gcloud app deploy app.staging.yaml --quiet --project=${{ env.PROJECT_ID }}

      - name: Comment staging URL on PR
        uses: actions/github-script@v8
        with:
          script: |
            const url = 'https://staging-dot-twogether-couples-app.de.r.appspot.com';
            const marker = '<!-- staging-deploy -->';
            const sha = context.sha.slice(0, 7);
            const body = `${marker}\n🚀 **Staging deployed:** ${url}\n\nLatest commit: \`${sha}\``;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }