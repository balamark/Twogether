name: Deploy to Google Cloud Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
              - 'cloudbuild.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'

  test-backend:
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: twogether_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Restore SQLx metadata cache
        uses: actions/cache@v4
        with:
          path: backend/.sqlx
          key: sqlx-${{ hashFiles('backend/migrations/**/*.sql', 'backend/Cargo.lock') }}
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Setup test database
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twogether_test
        run: |
          sqlx database create
          sqlx migrate run
      - name: Generate SQLx metadata (only if cache miss)
        if: ${{ hashFiles('backend/.sqlx/**') == '' }}
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twogether_test
        run: cargo sqlx prepare
      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twogether_test
          JWT_SECRET: test-secret-key
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
        run: cargo test

  test-frontend:
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Use Node from container
        run: node -v && npm -v
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run Playwright tests
        working-directory: ./frontend
        env:
          CI: true
        run: npm run test:e2e
      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  build-and-deploy:
    needs: [changes, test-backend, test-frontend]
    if: always() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps and build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build and push backend Docker image
        working-directory: ./backend
        run: |
          echo "🔨 Building backend Docker image..."
          docker build -t gcr.io/${{ env.PROJECT_ID }}/twogether-backend:${{ github.sha }} .
          echo "📤 Pushing to Google Container Registry..."
          docker push gcr.io/${{ env.PROJECT_ID }}/twogether-backend:${{ github.sha }}


      - name: Deploy with Cloud Build (lightweight deployment)
        timeout-minutes: 15
        run: |
          echo "🚀 Deploying pre-built image with Cloud Build..."
          gcloud builds submit --config=cloudbuild.yaml --project=${{ env.PROJECT_ID }} \
            --substitutions=_IMAGE_TAG="${{ github.sha }}",_DATABASE_URL="${{ secrets.DATABASE_URL }}",_JWT_SECRET="${{ secrets.JWT_SECRET }}",_SUPABASE_URL="${{ secrets.SUPABASE_URL }}",_SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}",_SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}",_EMAIL_FROM="${{ secrets.EMAIL_FROM }}",_EMAIL_PASS="${{ secrets.EMAIL_PASS }}",_RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}",_CORS_ORIGIN="${{ secrets.CORS_ORIGIN }}"

      - name: Check deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📊 Deployment Status Check"

          # Check GitHub Actions run status
          gh run list --limit 1 --json status,conclusion,headSha,workflowName

          # Check App Engine services
          echo "🚀 App Engine Services:"
          gcloud app services list --project=${{ env.PROJECT_ID }}

          # Check if deployment was successful
          if [ ${{ job.status }} == "success" ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "❌ Deployment failed or had issues"
          fi