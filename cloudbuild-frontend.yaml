steps:
  # Build frontend
  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['run', 'build']

  # Deploy frontend to App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Deploy frontend service only
        gcloud app deploy frontend/app.yaml --quiet --project=$PROJECT_ID

# Frontend deployment timeout - 15 minutes
timeout: '900s'

options:
  logging: CLOUD_LOGGING_ONLY