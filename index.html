<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />

    <!-- vite-ignore keeps these root-absolute: base './' would otherwise
         rewrite them relative, which 404s on nested routes like
         /billing/result. Both files live in public/. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" vite-ignore />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" vite-ignore />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7f2" />
    <title>Twogether · 把諮商帶回日常的伴侶練習工具</title>
    <meta name="description" content="諮商室只有一小時，真正的關係發生在剩下的 167 個小時。Twogether 是心理諮商的延伸工具，幫伴侶把心理師教的方法帶回每一天——記錄事件、練習溝通、修復連結。不取代諮商，而是延伸諮商。" />
    <!-- The SPA serves this same document on every route and shows the same
         logged-out preview to crawlers, so all routes canonicalize to the
         homepage. Public standalone pages (pricing.html, therapist-signup.html)
         declare their own canonicals. -->
    <link rel="canonical" href="https://twogether.fun/" />

    <!-- Social sharing (LINE / Facebook / Threads scrapers don't run JS, so
         these must live in the static shell). og-image.png is generated by
         scripts/generate-og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Twogether" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:title" content="Twogether · 把諮商帶回日常的伴侶練習工具" />
    <meta property="og:description" content="諮商室只有一小時，真正的關係發生在剩下的 167 個小時。Twogether 幫伴侶把心理師教的方法帶回每一天——不取代諮商，而是延伸諮商。" />
    <meta property="og:url" content="https://twogether.fun/" />
    <meta property="og:image" content="https://twogether.fun/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Twogether - 把心理師教的方法帶回每一天" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Twogether · 把諮商帶回日常的伴侶練習工具" />
    <meta name="twitter:description" content="諮商室只有一小時，真正的關係發生在剩下的 167 個小時。Twogether 幫伴侶把心理師教的方法帶回每一天——不取代諮商，而是延伸諮商。" />
    <meta name="twitter:image" content="https://twogether.fun/images/og-image.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Twogether",
      "url": "https://twogether.fun/",
      "description": "心理諮商的延伸工具（Therapy Companion）。諮商室只有一小時，真正的關係發生在剩下的 167 個小時——Twogether 幫伴侶把心理師教的方法帶回每一天，記錄事件、練習溝通、修復連結。不取代諮商，而是延伸諮商。",
      "inLanguage": "zh-Hant",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "TWD"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400;1,9..144,500&family=Manrope:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>

      <p>
        <a href="/pricing">付費方案</a> ·
        <a href="/therapist-signup">成為諮商師</a>
      </p>
      <p>此應用程式需要啟用 JavaScript 才能使用。</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
