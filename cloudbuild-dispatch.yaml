steps:
  # Deploy dispatch rules
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Deploy dispatch routing rules
        gcloud app deploy dispatch.yaml --quiet --project=$PROJECT_ID

# Dispatch deployment timeout - 5 minutes
timeout: '300s'

options:
  logging: CLOUD_LOGGING_ONLY