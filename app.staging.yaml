runtime: nodejs22
service: staging

# Staging service — separate from prod (default) service. Same project,
# isolated URL + DB. Auto-deployed by .github/workflows/deploy.yml on PRs.
env_variables:
  NODE_ENV: "production"
  PORT: "8080"
  # Staging database (separate Supabase project)
  DATABASE_URL: $_STAGING_DATABASE_URL
  # Reuse prod JWT secret so existing test accounts work across envs
  JWT_SECRET: $_JWT_SECRET
  # Staging Supabase (separate project).
  # Note: SUPABASE_SERVICE_ROLE_KEY holds the new "Secret" API key value
  # post-Supabase key rotation. SUPABASE_ANON_KEY (now "Publishable") isn't
  # plumbed because nothing in the backend reads it.
  SUPABASE_URL: $_STAGING_SUPABASE_URL
  SUPABASE_SERVICE_ROLE_KEY: $_STAGING_SUPABASE_SERVICE_ROLE_KEY
  # Email — shares prod's SMTP credentials and sender domain; only the links
  # differ (FRONTEND_URL below points at staging).
  EMAIL_FROM: $_EMAIL_FROM
  EMAIL_REPLY_TO: $_EMAIL_REPLY_TO
  SMTP_HOST: $_SMTP_HOST
  SMTP_PORT: $_SMTP_PORT
  SMTP_SECURE: $_SMTP_SECURE
  SMTP_USER: $_SMTP_USER
  SMTP_PASS: $_SMTP_PASS
  CORS_ORIGIN: $_CORS_ORIGIN
  # Outbound email links point at staging, not prod
  FRONTEND_URL: "https://staging-dot-twogether-couples-app.de.r.appspot.com"
  # Public origin for payment gateway callbacks (ECPay/NewebPay NotifyURL,
  # ReturnURL, ClientBackURL — routes/billing.js, routes/therapists.js).
  # Unset → falls back to http://localhost:8080 and 藍新 rejects 網址設定錯誤.
  APP_BASE_URL: "https://staging-dot-twogether-couples-app.de.r.appspot.com"
  # LLM provider for events × icebreaker (services/llmService.js).
  # If ANTHROPIC_API_KEY is missing, llmService falls back to the mock.
  LLM_PROVIDER: $_LLM_PROVIDER
  ANTHROPIC_API_KEY: $_ANTHROPIC_API_KEY
  # Reflection judge (LLM-as-judge second layer). Both optional: the judge model
  # defaults to ANTHROPIC_MODEL, and the step is on by default. Uncomment to pin
  # a stronger judge model or to disable the step without a code change.
  # ANTHROPIC_JUDGE_MODEL: $_ANTHROPIC_JUDGE_MODEL
  # REFLECTION_JUDGE_ENABLED: $_REFLECTION_JUDGE_ENABLED
  # Admin dashboard (/admin) Basic-Auth password. Without it, adminAuth returns
  # 503 "Admin disabled". Shares the prod ADMIN_PASSWORD secret.
  ADMIN_PASSWORD: $_ADMIN_PASSWORD
  # NewebPay 藍新 MPG — shares prod's merchant keys. MODE is pinned to "stage"
  # in deploy.yml so staging never sends real charges.
  NEWEBPAY_MERCHANT_ID: $_NEWEBPAY_MERCHANT_ID
  NEWEBPAY_HASH_KEY: $_NEWEBPAY_HASH_KEY
  NEWEBPAY_HASH_IV: $_NEWEBPAY_HASH_IV
  NEWEBPAY_MODE: $_NEWEBPAY_MODE

automatic_scaling:
  min_instances: 0
  max_instances: 1
  target_cpu_utilization: 0.8

instance_class: F1

handlers:
  - url: /assets/(.*)
    static_files: dist/assets/\1
    upload: dist/assets/(.*)
    secure: always
    # Vite content-hashes every file under /assets, so a changed file gets a
    # new name — safe to cache for a year.
    expiration: "365d"

  - url: /images/(.*)
    static_files: dist/images/\1
    upload: dist/images/(.*)
    secure: always
    # Roleplay covers etc. rarely change; 1h made every visit re-download them.
    expiration: "7d"

  - url: /(.*\.(ico|png|svg))$
    static_files: dist/\1
    upload: dist/.*\.(ico|png|svg)$
    secure: always
    expiration: "1d"

  - url: /api/.*
    script: auto
    secure: always

  - url: /health
    script: auto
    secure: always

  - url: /.*
    script: auto
    secure: always
