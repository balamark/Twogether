steps:
  # Install dependencies and build frontend
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - -lc
      - |
        # Install all deps including devDependencies for build tools like Vite
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi
    
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - -lc
      - |
        npm run build

  # Deploy to App Engine Standard
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: ['app', 'deploy', '--quiet', '--project=$PROJECT_ID']

timeout: '900s'

options:
  logging: CLOUD_LOGGING_ONLY
