steps:
  # Install dependencies and build frontend
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci', '--production']
    
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']

  # Deploy to App Engine Standard
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: ['app', 'deploy', '--quiet', '--project=$PROJECT_ID']

timeout: '900s'

options:
  logging: CLOUD_LOGGING_ONLY
