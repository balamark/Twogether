steps:
  # Build frontend
  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['run', 'build']

  # Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/twogether-backend:$BUILD_ID'
      - 'backend'
    timeout: '1800s'  # 30 minutes for Rust build

  # Deploy backend to App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Update backend app.yaml with environment variables
        python3 << 'EOF'
        import os

        # Read the current app.yaml
        with open('backend/app.yaml', 'r') as f:
            content = f.read()

        # Replace env_variables section
        lines = content.split('\n')
        new_lines = []
        skip_env_vars = False

        for line in lines:
            if line.strip().startswith('env_variables:'):
                # Add our env_variables section
                new_lines.append('env_variables:')
                new_lines.append('  RUST_LOG: info')
                new_lines.append('  ENVIRONMENT: production')
                new_lines.append(f'  DATABASE_URL: "{os.environ["DATABASE_URL"]}"')
                new_lines.append(f'  JWT_SECRET: "{os.environ["JWT_SECRET"]}"')
                new_lines.append(f'  SUPABASE_URL: "{os.environ["SUPABASE_URL"]}"')
                new_lines.append(f'  SUPABASE_ANON_KEY: "{os.environ["SUPABASE_ANON_KEY"]}"')
                new_lines.append(f'  SUPABASE_SERVICE_ROLE_KEY: "{os.environ["SUPABASE_SERVICE_ROLE_KEY"]}"')
                new_lines.append(f'  EMAIL_FROM: "{os.environ["EMAIL_FROM"]}"')
                new_lines.append(f'  EMAIL_PASS: "{os.environ["EMAIL_PASS"]}"')
                new_lines.append(f'  RESEND_API_KEY: "{os.environ["RESEND_API_KEY"]}"')
                new_lines.append(f'  CORS_ORIGIN: "{os.environ["CORS_ORIGIN"]}"')
                skip_env_vars = True
            elif skip_env_vars and line.strip() and not line.startswith('  '):
                # End of env_variables section
                skip_env_vars = False
                new_lines.append(line)
            elif not skip_env_vars:
                new_lines.append(line)

        # Write back to file
        with open('backend/app.yaml', 'w') as f:
            f.write('\n'.join(new_lines))
        EOF

        # Deploy to App Engine
        gcloud app deploy backend/app.yaml frontend/app.yaml dispatch.yaml --quiet --project=$PROJECT_ID
    env:
      - 'DATABASE_URL=$_DATABASE_URL'
      - 'JWT_SECRET=$_JWT_SECRET'
      - 'SUPABASE_URL=$_SUPABASE_URL'
      - 'SUPABASE_ANON_KEY=$_SUPABASE_ANON_KEY'
      - 'SUPABASE_SERVICE_ROLE_KEY=$_SUPABASE_SERVICE_ROLE_KEY'
      - 'EMAIL_FROM=$_EMAIL_FROM'
      - 'EMAIL_PASS=$_EMAIL_PASS'
      - 'RESEND_API_KEY=$_RESEND_API_KEY'
      - 'CORS_ORIGIN=$_CORS_ORIGIN'

# Overall build timeout - 45 minutes
timeout: '2700s'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _DATABASE_URL: ''
  _JWT_SECRET: ''
  _SUPABASE_URL: ''
  _SUPABASE_ANON_KEY: ''
  _SUPABASE_SERVICE_ROLE_KEY: ''
  _EMAIL_FROM: ''
  _EMAIL_PASS: ''
  _RESEND_API_KEY: ''
  _CORS_ORIGIN: ''