steps:
  # Build frontend
  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['run', 'build']

  # Deploy backend to App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Update backend app.yaml to use pre-built image
        python3 -c "
import os
image_url = f'gcr.io/{os.environ[\"PROJECT_ID\"]}/twogether-backend:{os.environ[\"_IMAGE_TAG\"]}'
content = f'''env: flex
service: backend
runtime: custom
runtime_config:
  container_image: {image_url}

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 2
  cpu_utilization:
    target_utilization: 0.6

readiness_check:
  path: /health
  check_interval_sec: 10
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

liveness_check:
  path: /health
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

env_variables:
  RUST_LOG: info
  ENVIRONMENT: production
  DATABASE_URL: \"{os.environ['DATABASE_URL']}\"
  JWT_SECRET: \"{os.environ['JWT_SECRET']}\"
  SUPABASE_URL: \"{os.environ['SUPABASE_URL']}\"
  SUPABASE_ANON_KEY: \"{os.environ['SUPABASE_ANON_KEY']}\"
  SUPABASE_SERVICE_ROLE_KEY: \"{os.environ['SUPABASE_SERVICE_ROLE_KEY']}\"
  EMAIL_FROM: \"{os.environ['EMAIL_FROM']}\"
  EMAIL_PASS: \"{os.environ['EMAIL_PASS']}\"
  RESEND_API_KEY: \"{os.environ['RESEND_API_KEY']}\"
  CORS_ORIGIN: \"{os.environ['CORS_ORIGIN']}\"
'''
with open('backend/app.yaml', 'w') as f:
    f.write(content)
"

        # Deploy to App Engine
        gcloud app deploy backend/app.yaml frontend/app.yaml dispatch.yaml --quiet --project=$PROJECT_ID
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - '_IMAGE_TAG=$_IMAGE_TAG'
      - 'DATABASE_URL=$_DATABASE_URL'
      - 'JWT_SECRET=$_JWT_SECRET'
      - 'SUPABASE_URL=$_SUPABASE_URL'
      - 'SUPABASE_ANON_KEY=$_SUPABASE_ANON_KEY'
      - 'SUPABASE_SERVICE_ROLE_KEY=$_SUPABASE_SERVICE_ROLE_KEY'
      - 'EMAIL_FROM=$_EMAIL_FROM'
      - 'EMAIL_PASS=$_EMAIL_PASS'
      - 'RESEND_API_KEY=$_RESEND_API_KEY'
      - 'CORS_ORIGIN=$_CORS_ORIGIN'

# Overall build timeout - 10 minutes (deployment only)
timeout: '600s'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _IMAGE_TAG: ''
  _DATABASE_URL: ''
  _JWT_SECRET: ''
  _SUPABASE_URL: ''
  _SUPABASE_ANON_KEY: ''
  _SUPABASE_SERVICE_ROLE_KEY: ''
  _EMAIL_FROM: ''
  _EMAIL_PASS: ''
  _RESEND_API_KEY: ''
  _CORS_ORIGIN: ''