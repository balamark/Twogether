runtime: nodejs22

# Environment variables (secure method)
env_variables:
  NODE_ENV: "production"
  PORT: "8080"
  # Public site origin used to build links in outgoing emails (confirm-email-
  # change, password reset, pairing invite, welcome, therapist verify). Must be
  # the custom domain — the *.appspot.com default trips Google Safe Browsing's
  # "Deceptive site ahead" warning. Plain literal (public, not a secret), so
  # envsubst leaves it untouched.
  FRONTEND_URL: "https://twogether.fun"
  # Database connection
  DATABASE_URL: $_DATABASE_URL
  # JWT Secret
  JWT_SECRET: $_JWT_SECRET
  # Supabase configuration
  SUPABASE_URL: $_SUPABASE_URL
  SUPABASE_ANON_KEY: $_SUPABASE_ANON_KEY
  SUPABASE_SERVICE_ROLE_KEY: $_SUPABASE_SERVICE_ROLE_KEY
  # Email configuration (services/emailService.js — nodemailer over SMTP).
  # EMAIL_FROM must be an address on the brand domain (e.g.
  # "Twogether <hello@twogether.fun>") so SPF/DKIM/DMARC align with the
  # twogether.fun links inside the mail — a mismatch is what sent pairing
  # invites to spam. See docs/EMAIL_DELIVERABILITY.md.
  EMAIL_FROM: $_EMAIL_FROM
  EMAIL_REPLY_TO: $_EMAIL_REPLY_TO
  SMTP_HOST: $_SMTP_HOST
  SMTP_PORT: $_SMTP_PORT
  SMTP_SECURE: $_SMTP_SECURE
  SMTP_USER: $_SMTP_USER
  SMTP_PASS: $_SMTP_PASS
  # CORS origin (not needed for combined app)
  CORS_ORIGIN: $_CORS_ORIGIN
  # LLM provider for events × icebreaker (services/llmService.js).
  LLM_PROVIDER: $_LLM_PROVIDER
  ANTHROPIC_API_KEY: $_ANTHROPIC_API_KEY
  # Admin funnel dashboard gate (/admin and /api/admin/*). Required to enable
  # the dashboard — middleware returns 503 when this is unset/empty.
  ADMIN_PASSWORD: $_ADMIN_PASSWORD
  # LINE Messaging API: mirror in-app notifications to a user's LINE. The
  # channel access token is minted from these at runtime (services/lineService).
  LINE_CHANNEL_ID: $_LINE_CHANNEL_ID
  LINE_CHANNEL_SECRET: $_LINE_CHANNEL_SECRET
  # The official account's "add friend" deep link, shown in Settings.
  LINE_OA_ADD_URL: $_LINE_OA_ADD_URL

# Automatic scaling (free tier compatible)
automatic_scaling:
  min_instances: 0
  max_instances: 1
  target_cpu_utilization: 0.8

# Instance class (free tier)
instance_class: F1

# Static file handling for React assets
handlers:
  # Static assets with cache headers
  - url: /assets/(.*)
    static_files: dist/assets/\1
    upload: dist/assets/(.*)
    secure: always
    expiration: "1d"
    
  # Images with cache headers
  - url: /images/(.*)
    static_files: dist/images/\1
    upload: dist/images/(.*)
    secure: always
    expiration: "1h"
    
  # Favicon and other root assets
  - url: /(.*\.(ico|png|svg))$
    static_files: dist/\1
    upload: dist/.*\.(ico|png|svg)$
    secure: always
    expiration: "1d"
    
  # API routes go to the server
  - url: /api/.*
    script: auto
    secure: always
    
  # Health check
  - url: /health
    script: auto
    secure: always
    
  # All other routes serve the React app (for client-side routing)
  - url: /.*
    script: auto
    secure: always
